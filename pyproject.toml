[build-system]
requires = ["setuptools>=64", "wheel", "torch>=2.5"]
build-backend = "setuptools.build_meta"


[project]
name = "spikinn"
version = "0.1.0"
description = "Unsupervised convolutional spiking neural networks with STDP"

requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "scikit-learn>=1.6",
    "tqdm>=4.67",
    "torch>=2.5",
    "torchvision>=0.20",
    "seaborn>=0.13",
    "pillow>=10.1",
    "kagglehub>=1.0",
    "jupyter>=1.1.1",
]


[project.optional-dependencies]
cpu = [
    "torch>=2.5",
    "torchvision>=0.20",
]
cuda = [
    "torch>=2.11",
    "torchvision>=0.26",
    "cuml-cu12>=26.4",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "black>=24.0",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["spikinn*", "spikinn_backend*"]
exclude = ["benchmarks*", "scripts*", "logs*", "data*", "checkpoints*"]


[tool.setuptools.package-data]
spikinn_backend = ["csrc/*.cpp", "csrc/*.cu", "csrc/*.h"]

[tool.pytest.ini_options]
# archive/ imports deleted modules and breaks collection.
testpaths = ["spikinn/tests"]
norecursedirs = ["archive", ".venv", "build", "logs", "data", "torch_extensions"]

[tool.black]
target-version = ["py310"]
line-length = 88

[tool.uv]
default-groups = ["dev"]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cuda" },
    ],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu129", extra = "cuda" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu129", extra = "cuda" },
]
